# Builds the browser-only static client (`npm run build:static`, DESIGN §4.4) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc pins a release with the CVE-2026-111497 (HTTP2Shell) fix
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          # the game server for online play (repository variable, e.g. https://any-game.dv8.no);
          # unset = an offline demo build, as before
          ANYWORLD_SERVER_URL: ${{ vars.ANYWORLD_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
